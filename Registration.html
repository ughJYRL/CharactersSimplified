<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="LogInStyle.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide Impact | Registration</title>
</head>
<body>
  <main>
    <h1>Guide Impact Registration</h1>
    <p>Create an account for Guide Impact.</p>

    <form id="registrationForm">
      <label for="Username">Create a username</label>
      <input type="text" id="Username" name="Username"
             autocomplete="username" minlength="3" required>

      <label for="Password">Create a password</label>
      <input type="password" id="Password" name="Password"
             autocomplete="new-password" minlength="6" required>

      <label for="ConfirmPassword">Confirm the password</label>
      <input type="password" id="ConfirmPassword" name="ConfirmPassword"
             autocomplete="new-password" minlength="6" required>

      <button type="submit">Create Account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>Already have an account? <a href="LogIn.html">Log in</a></p>
  </main>

  <script>
    const registrationForm = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    registrationForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("Username").value.trim();
      const password = document.getElementById("Password").value;
      const confirmPassword = document.getElementById("ConfirmPassword").value;

      if (username.length < 3) {
        message.textContent = "Username must be at least 3 characters long.";
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters long.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      // Demo-only account storage in this browser.
      localStorage.setItem("charactersSimplifiedAccount", JSON.stringify({
        username: username,
        password: password
      }));

      message.textContent = "Account created! Opening the login page...";
      registrationForm.reset();

      window.location.href = "LogIn.html";
    });
  </script>
</body>
</html>
